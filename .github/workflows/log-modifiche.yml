name: Log Modifiche

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  append-log:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Append commits to log-modifiche.txt
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime
          evpath = os.environ.get('GITHUB_EVENT_PATH')
          if not evpath or not os.path.exists(evpath):
              sys.exit(0)
          with open(evpath, 'r', encoding='utf-8') as f:
              ev = json.load(f)
          commits = ev.get('commits') or []
          if not commits:
              head = ev.get('head_commit')
              if head:
                  commits = [head]
          if not commits:
              sys.exit(0)
          now = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%SZ')
          ref = os.environ.get('GITHUB_REF', '')
          actor = os.environ.get('GITHUB_ACTOR', '')
          os.makedirs(os.path.dirname('log-modifiche.txt') or '.', exist_ok=True)
          with open('log-modifiche.txt', 'a', encoding='utf-8') as out:
              out.write('\n---- Push: {} {} by {} ----\n'.format(now, ref, actor))
              for c in commits:
                  sha = c.get('id','')[:7]
                  msg = c.get('message','').strip().replace('\n', ' | ')
                  author = c.get('author', {})
                  name = author.get('name') or author.get('username') or ''
                  email = author.get('email') or ''
                  timestamp = c.get('timestamp') or ''
                  added = ', '.join(c.get('added', []))
                  removed = ', '.join(c.get('removed', []))
                  modified = ', '.join(c.get('modified', []))
                  out.write(f'{timestamp} {sha} {name} <{email}>\nMessage: {msg}\nFiles added: {added}\nFiles removed: {removed}\nFiles modified: {modified}\n\n')
          PY

      - name: Commit and push log file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-modifiche.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "CI: aggiorna log-modifiche.txt per push $GITHUB_REF"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
